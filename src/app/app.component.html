<main class="app-layout">
  <header class="toolbar">
    <span class="toolbar-brand">
      <i class="fa-solid fa-code"></i> {{ title }}
    </span>
    <div class="toolbar-group">
      <label class="toolbar-label"><i class="fa-solid fa-palette"></i></label>
      <select class="toolbar-select" [value]="selectedTheme()" (change)="onThemeChange($any($event.target).value)">
        @for (theme of themes; track theme.name) {
          <option [value]="theme.name" [selected]="theme.name === selectedTheme()">{{ theme.label }}</option>
        }
      </select>
    </div>
  </header>

  <as-split
    class="editor-area"
    [direction]="screenSize.isMobile() ? 'vertical' : 'horizontal'"
    [gutterSize]="6"
    (dragEnd)="onSplitDragEnd($event)"
    [formGroup]="editorForm">

    <as-split-area class="panel panel-editor" [size]="editorSize()">
      <div class="panel-header">
        <span class="panel-title"><i class="fa-solid fa-file-code"></i> Editor</span>
      </div>
      <div class="panel-body">
        <app-editor
          formControlName="editorControl"
          [theme]="selectedTheme()">
        </app-editor>
      </div>
    </as-split-area>

    <as-split-area class="panel panel-console" [size]="100 - editorSize()">
      <div class="panel-header">
        <span class="panel-title"><i class="fa-solid fa-terminal"></i> Console</span>
        <button class="btn-icon" title="Clear console" (click)="clearConsole()">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
      <div class="panel-body">
        <app-console-view #consoleView formControlName="consoleControl"></app-console-view>
      </div>
    </as-split-area>

  </as-split>
</main>
